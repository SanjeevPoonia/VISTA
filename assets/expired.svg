<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
    <title id="title">Expired checklist</title>
    <desc id="desc">Clipboard with a clock and a red cross indicating an expired checklist</desc>

    <!-- Clipboard body -->
    <rect x="10" y="12" width="36" height="40" rx="3" ry="3" fill="#FFFFFF" stroke="#2F3A4A" stroke-width="1.6"/>
    <!-- Clipboard top clip -->
    <rect x="18" y="6" width="20" height="6" rx="1.2" ry="1.2" fill="#2F3A4A"/>

    <!-- Lines representing checklist -->
    <line x1="14" y1="20" x2="30" y2="20" stroke="#2F3A4A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="30" y2="26" stroke="#2F3A4A" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="14" y1="32" x2="30" y2="32" stroke="#2F3A4A" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Right-side circle (clock) -->
    <g transform="translate(36,34)">
        <circle cx="10" cy="0" r="10" fill="#F6F7F9" stroke="#2F3A4A" stroke-width="1.2"/>
        <!-- clock hands -->
        <line x1="10" y1="0" x2="10" y2="-5" stroke="#2F3A4A" stroke-width="1.4" stroke-linecap="round" transform="translate(-10,0)"/>
        <line x1="10" y1="0" x2="13" y2="1.5" stroke="#2F3A4A" stroke-width="1.4" stroke-linecap="round" transform="translate(-10,0)"/>
    </g>

    <!-- Red cross/expired mark over the clock -->
    <g transform="translate(36,34)">
        <line x1="3" y1="-7" x2="17" y2="7" stroke="#D9534F" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="17" y1="-7" x2="3" y2="7" stroke="#D9534F" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Optional small ribbon/text "EXPIRED" under clipboard -->
    <rect x="8" y="50" width="36" height="6" rx="1.5" ry="1.5" fill="#D9534F"/>
    <text x="26" y="54.5" font-family="Arial, Helvetica, sans-serif" font-size="3.8" fill="#FFFFFF" text-anchor="middle" font-weight="700">EXPIRED</text>
</svg>
